name: Repair and validate KVM bot integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply KVM bot integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('bot.py')
          text=p.read_text(encoding='utf-8')
          marker='# SNCK_KVM_SHARED_INTEGRATION_V1'
          if marker not in text:
              block=r'''# SNCK_KVM_SHARED_INTEGRATION_V1
# Canonical KVM backend: Discord and web panel share vps.db.
from kvm_discord_bridge import ensure_schema as _kvm_ensure_schema, node_uri as _kvm_node_uri
from kvm_discord_bridge import deploy as _kvm_deploy, start as _kvm_start, stop as _kvm_stop
from kvm_discord_bridge import reboot as _kvm_reboot, delete as _kvm_delete, stats as _kvm_stats
from kvm_discord_bridge import persist_vps as _kvm_persist_vps

_kvm_ensure_schema()

def _snck_refresh_cache():
    global vps_data
    _kvm_ensure_schema()
    vps_data = get_vps_data()
    return vps_data

async def _snck_kvm_deploy(ctx, user, os_version, node_id, ram, cpu, disk, expiry_days=None):
    _snck_refresh_cache()
    uid=str(user.id)
    node=get_node(node_id)
    if not node:
        raise RuntimeError(f'Node {node_id} not found')
    name_base=sanitize_username_for_container(user.name.lower())[:24] or 'user'
    conn=get_db(); cur=conn.cursor(); cur.execute('SELECT COALESCE(MAX(id),0)+1 FROM vps'); next_id=cur.fetchone()[0]; conn.close()
    name=f'{name_base}-vps-{next_id}'
    password=generate_strong_password()
    storage=node.get('storage') or '/var/lib/libvirt/images'
    uri=node.get('url') or ''
    expiry=(datetime.now()+timedelta(days=expiry_days or DEFAULT_VPS_EXPIRATION_DAYS)).isoformat()
    await _kvm_deploy(name,ram,cpu,disk,password,os_version= os_version,storage=storage,uri=uri)
    vps_id=_kvm_persist_vps(uid,node_id,name,ram,cpu,disk,os_version,password,expiry)
    _snck_refresh_cache()
    return name,password,vps_id,expiry

async def _snck_os_select(self, interaction):
    if str(interaction.user.id)!=str(self.ctx.author.id):
        await interaction.response.send_message(embed=create_error_embed('Access Denied','Only the command author can select the OS.'),ephemeral=True); return
    os_version=self.select.values[0]
    for child in self.children: child.disabled=True
    await interaction.response.edit_message(view=self)
    try:
        name,password,vps_id,expiry=await _snck_kvm_deploy(self.ctx,self.user,os_version,self.node_id,self.ram,self.cpu,self.disk,self.expiry_days)
        embed=create_success_embed('VPS Created Successfully',f'KVM VPS `{name}` is running and synchronized with the panel.')
        add_field(embed,'VPS ID',f'#{vps_id}',True); add_field(embed,'Owner',self.user.mention,True)
        add_field(embed,'Resources',f'{self.ram}GB RAM / {self.cpu} CPU / {self.disk}GB Disk',False)
        add_field(embed,'OS',os_version,True); add_field(embed,'SSH','Root credentials were generated during cloud-init. Use the panel to view the VPS details.',False)
        await interaction.followup.send(embed=embed)
    except Exception as e:
        logger.exception('KVM VPS creation failed')
        await interaction.followup.send(embed=create_error_embed('VPS Creation Failed',str(e)[:3500]))
    finally:
        _deploying_users.discard(str(self.user.id))

OSSelectView.select_os=_snck_os_select

async def _snck_free_deploy(ctx,user,os_version,node_id):
    name,password,vps_id,expiry=await _snck_kvm_deploy(ctx,user,os_version,node_id,DEPLOY_RAM,DEPLOY_CPU,DEPLOY_DISK)
    try:
        role=await get_or_create_vps_role(ctx.guild) if ctx.guild else None
        if role: await user.add_roles(role,reason=f'{BOT_NAME} VPS ownership granted')
    except Exception: pass
    embed=create_success_embed('VPS Deployed',f'KVM VPS `{name}` is ready. It is also visible in the web panel.')
    add_field(embed,'VPS ID',f'#{vps_id}',True); add_field(embed,'Owner',user.mention,True)
    add_field(embed,'Resources',f'{DEPLOY_RAM}GB RAM / {DEPLOY_CPU} CPU / {DEPLOY_DISK}GB Disk',False)
    add_field(embed,'OS',os_version,True)
    try:
        await user.send(embed=create_success_embed('VPS Credentials',f'Your KVM VPS `{name}` is ready. Root password: `{password}`'))
    except Exception: pass
    await ctx.send(embed=embed)

_do_free_deploy=_snck_free_deploy

async def _snck_manage_action(self, interaction, action):
    try: await interaction.response.defer(ephemeral=True)
    except Exception: return
    if str(interaction.user.id)!=str(self.user_id) and not self.is_admin:
        await interaction.followup.send(embed=create_error_embed('Access Denied','This is not your VPS.'),ephemeral=True); return
    if self.selected_index is None:
        await interaction.followup.send(embed=create_error_embed('No VPS Selected','Please select a VPS first.'),ephemeral=True); return
    actual=self.actual_index if self.is_shared else self.indices[self.selected_index]
    _snck_refresh_cache()
    target=vps_data.get(str(self.owner_id),[])[actual]
    node=get_node(target.get('node_id',1)); uri=_kvm_node_uri(node); name=target['container_name']
    try:
        if action=='start': await _kvm_start(name,uri); target['status']='running'
        elif action=='stop': await _kvm_stop(name,uri); target['status']='stopped'
        elif action=='reboot': await _kvm_reboot(name,uri); target['status']='running'
        elif action=='stats':
            s=await _kvm_stats(name,uri)
            await interaction.followup.send(embed=create_info_embed('Live VPS Statistics',f'`{name}`\nStatus: `{s["status"]}`\nIP: `{s["ip"] or "pending"}`\nCPU: `{s["cpu"]:.1f}%`\nRAM: `{s["ram"]["pct"]:.1f}%`'),ephemeral=True); return
        elif action=='tmate' or action=='sshx':
            await interaction.followup.send(embed=create_info_embed('KVM SSH','Use the VPS IP shown by the panel and the root credentials created at deployment.'),ephemeral=True); return
        else:
            await interaction.followup.send(embed=create_error_embed('Unsupported Action',f'Action `{action}` is not available on the KVM backend yet.'),ephemeral=True); return
        save_vps_data_immediate(); _snck_refresh_cache()
        await interaction.followup.send(embed=create_success_embed('VPS Updated',f'`{name}` is now `{target.get("status")}`.'),ephemeral=True)
    except Exception as e:
        await interaction.followup.send(embed=create_error_embed('VPS Operation Failed',str(e)[:3500]),ephemeral=True)

ManageView.action_callback=_snck_manage_action

async def _snck_restart(ctx,container_name):
    _snck_refresh_cache(); node_id=find_node_id_for_container(container_name); node=get_node(node_id)
    try:
        await _kvm_reboot(container_name,_kvm_node_uri(node))
        for lst in vps_data.values():
            for v in lst:
                if v['container_name']==container_name: v['status']='running'
        save_vps_data_immediate(); _snck_refresh_cache()
        await ctx.send(embed=create_success_embed('VPS Restarted',f'KVM VPS `{container_name}` restarted.'))
    except Exception as e: await ctx.send(embed=create_error_embed('Restart Failed',str(e)[:3500]))

async def _snck_vps_stats(ctx,container_name):
    _snck_refresh_cache(); node=get_node(find_node_id_for_container(container_name))
    try:
        s=await _kvm_stats(container_name,_kvm_node_uri(node))
        await ctx.send(embed=create_info_embed(f'VPS Statistics - {container_name}',f'Status: `{s["status"]}`\nIP: `{s["ip"] or "pending"}`\nCPU: `{s["cpu"]:.1f}%`\nRAM: `{s["ram"]["pct"]:.1f}%`'))
    except Exception as e: await ctx.send(embed=create_error_embed('Statistics Failed',str(e)[:3500]))

# Replace registered command callbacks so existing Discord commands use KVM.
for _name,_fn in {'restart-vps':_snck_restart,'vps-stats':_snck_vps_stats}.items():
    _cmd=bot.get_command(_name)
    if _cmd: _cmd.callback=_fn

# Refresh the shared database before customer-facing inventory commands.
for _name in ('myvps','manage','vpsinfo','vps-uptime'):
    _cmd=bot.get_command(_name)
    if _cmd:
        _old=_cmd.callback
        async def _wrapped(ctx,*args,_old=_old,**kwargs):
            _snck_refresh_cache()
            return await _old(ctx,*args,**kwargs)
        _cmd.callback=_wrapped

# SNCK_KVM_SHARED_INTEGRATION_V1_END
'''
              anchor='if __name__ == "__main__":'
              if anchor not in text:
                  raise SystemExit('main anchor not found')
              text=text.replace(anchor,block+'\n'+anchor,1)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Validate Python
        run: |
          python3 -m py_compile bot.py kvm.py kvm_discord_bridge.py

      - name: Commit repaired bot
        shell: bash
        run: |
          git config user.name "snck-kvm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot.py kvm_discord_bridge.py
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Fix KVM VPS deployment and panel bot synchronization"
          git push
