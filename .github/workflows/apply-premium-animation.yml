name: Snck premium panel validation

on:
  push:
    branches: [main]
    paths:
      - 'snck_panel_v2.py'
      - '.github/workflows/apply-premium-animation.yml'
  pull_request:
    paths:
      - 'snck_panel_v2.py'
      - '.github/workflows/apply-premium-animation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical panel
        run: python3 -m py_compile snck_panel_v2.py
